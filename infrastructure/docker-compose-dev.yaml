version: "3.9"

services:
  # =========================================
  # PostgreSQL
  # =========================================
  postgres:
    image: postgres:16

    container_name: ecommerce_postgres

    restart: always

    ports:
      - "5432:5432"

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecommerce

    volumes:
      - postgres_data:/var/lib/postgresql/data

  # =========================================
  # pgAdmin (Postgres UI)
  # =========================================
  pgadmin:
    image: dpage/pgadmin4

    container_name: ecommerce_pgadmin

    restart: always

    ports:
      - "5050:80"

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin

    depends_on:
      - postgres

  # =========================================
  # Redis
  # =========================================
  redis:
    image: redis:7-alpine

    container_name: ecommerce_redis

    restart: always

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

  # =========================================
  # RedisInsight (Redis UI)
  # =========================================
  redisinsight:
    image: redis/redisinsight:latest

    container_name: ecommerce_redisinsight

    restart: always

    ports:
      - "5540:5540"

    depends_on:
      - redis

# =========================================
# Named Volumes
# =========================================
volumes:
  postgres_data:
  redis_data:
